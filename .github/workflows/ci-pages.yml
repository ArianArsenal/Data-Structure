# Checks and tests on every push and pull request; optionally deploys site/ to GitHub Pages from main.
name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generated files are up to date
        run: |
          node tools/build_code.js
          git diff --exit-code -- site/ds site/js/generated
      - name: Step tags match the tracers
        run: node tools/check_steps.js
      - name: Python, C++ and Java tests
        run: node tools/run_tests.js

  # Off until Pages is available (public repo or paid plan): set the repository
  # variable PAGES_ENABLED=true and choose "GitHub Actions" as the Pages source.
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
